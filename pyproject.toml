[project]
name = "sakurafinder"
version = "0.1.0"
description = "A cross-platform file indexer inspired by Everything"
requires-python = ">=3.10"
dependencies = [
    "watchdog>=4.0",
    "PySide6>=6.6",
    "send2trash>=1.8",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
sakurafinder = "sakurafinder.cli:main"
sakurafinder-daemon = "sakurafinder.daemon:main"
sakurafinder-ui = "sakurafinder.ui.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# ✅ 关键：显式指定包目录
[tool.hatch.build.targets.wheel]
packages = ["sakurafinder"]